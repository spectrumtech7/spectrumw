{% load static %}
<html>
<head>
<style>
  @page {
    size: A4;
    margin-top: 90pt;
    margin-left: 40pt;
    margin-right: 40pt;
    margin-bottom: 40pt;

    @frame logo_frame {
      -pdf-frame-content: logo_content;
      left: 40pt; top: 20pt; width: 140pt; height: 60pt;
    }
    /* @frame content_frame {
      left: 40pt; top: 130pt; width: 515pt; height: 650pt;
    } */
  }
  
  body { font-family: Helvetica, sans-serif; }
  #logo_content img { width: 120pt; }

  h1.product-name {
    font-size: 20pt;
    font-weight: bold;
    color: #1f4e79;
    text-align: center;
    text-decoration: underline;
    margin-bottom: 6pt;
  }
  .price {
    font-size: 12pt;
    font-weight: bold;
    text-align: center;
    margin-bottom: 8pt;
  }
  .photo {
    text-align: center;
    margin-bottom: 12pt;
  }
  .product-image { width: 170pt; }

  table.spec-table {
    width: 100%;
    border-collapse: collapse;
  }
  table.spec-table td {
    border: 1px solid #000000;
    padding: 5pt 8pt;
    font-size: 10pt;
  }
  table.spec-table td.no { width: 8%; text-align: center; }
  table.spec-table td.label { width: 36%; font-weight: bold; }
  table.spec-table td.unit { width: 14%; text-align: center; }
  table.spec-table td.th {
    font-weight: bold;
    text-align: center;
    background-color: #1f4e79;
    color: #ffffff;
  }
</style>
</head>
<body>
  <div id="logo_content"><img src="{% static 'images/logo.png' %}"></div>

  <h1 class="product-name">{{ product.name }}</h1>
  <p class="price">Price: Rs. {{ product.price }}</p>

  <div class="photo"><img class="product-image" src="{{ product.cover_image }}"></div>

  <table class="spec-table">
    <tr>
      <td class="th no">No.</td>
      <td class="th">Parameter</td>
      <td class="th">Unit</td>
      <td class="th">Value</td>
    </tr>
    {% for spec in specifications %}
    <tr>
      <td class="no">{{ forloop.counter }}</td>
      <td class="label">{{ spec.label }}</td>
      <td class="unit">{{ spec.unit }}</td>
      <td>{{ spec.value }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No specifications added yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
