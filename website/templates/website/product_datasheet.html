{% load static %}
<html>
<head>
<style>
  @page {
    size: A4;
    margin: 2cm;

    @frame watermark_frame {
      -pdf-frame-content: watermark_content;
      left: 127pt; top: 230pt; width: 340pt; height: 340pt;
    }
    @frame logo_frame {
      -pdf-frame-content: logo_content;
      left: 20pt; top: 20pt; width: 140pt; height: 70pt;
    }
    @frame content_frame {
      left: 56pt; top: 110pt; width: 482pt; height: 670pt;
    }
  }
  body { font-family: Helvetica, sans-serif; }
  #logo_content img { width: 110pt; }
  #watermark_content img { width: 340pt; }

  h1.product-name {
    font-size: 22pt;
    font-weight: bold;
    color: #1f4e79;
    margin-bottom: 4pt;
  }
  .price {
    font-size: 13pt;
    font-weight: bold;
    margin-bottom: 16pt;
  }

  table.layout-table {
    width: 100%;
    border-collapse: collapse;
  }
  table.layout-table td {
    vertical-align: top;
  }
  td.photo-cell {
    width: 45%;
    padding-right: 12pt;
  }
  td.spec-cell {
    width: 55%;
  }
  .product-image {
    width: 190pt;
  }

  table.spec-table {
    width: 100%;
    border-collapse: collapse;
  }
  table.spec-table td {
    border: 1px solid #cccccc;
    padding: 4pt 8pt;
    font-size: 10pt;
  }
  table.spec-table td.label {
    font-weight: bold;
    width: 40%;
    background-color: #f2f2f2;
  }
</style>
</head>
<body>
  <div id="watermark_content"><img src="{% static 'images/logo_watermark_diagonal.png' %}"></div>
  <div id="logo_content"><img src="{% static 'images/logo.png' %}"></div>

  <h1 class="product-name">{{ product.name }}</h1>
  <p class="price">Price: Rs. {{ product.price }}</p>

  <table class="layout-table">
    <tr>
      <td class="photo-cell">
        <img class="product-image" src="{{ product.cover_image }}">
      </td>
      <td class="spec-cell">
        <table class="spec-table">
          {% for spec in specifications %}
          <tr>
            <td class="label">{{ spec.label }}</td>
            <td>{{ spec.value }}</td>
          </tr>
          {% empty %}
          <tr><td colspan="2">No specifications added yet.</td></tr>
          {% endfor %}
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
