{% load static %}
<html>
<head>
<style>
  @page {
    size: A4;
    margin-top: 90pt;
    margin-left: 250pt;
    margin-right: 40pt;
    margin-bottom: 40pt;

    @frame logo_frame {
      -pdf-frame-content: logo_content;
      left: 40pt; top: 20pt; width: 140pt; height: 60pt;
    }
    @frame photo_frame {
      -pdf-frame-content: photo_content;
      left: 40pt; top: 110pt; width: 195pt; height: 420pt;
    }
  }
  body { font-family: Helvetica, sans-serif; }
  #logo_content img { width: 120pt; }
  #photo_content img { width: 190pt; }

  h1.product-name {
    font-size: 16pt;
    font-weight: bold;
    color: #1f4e79;
    margin-bottom: 4pt;
  }
  .price {
    font-size: 12pt;
    font-weight: bold;
    margin-bottom: 8pt;
  }

  table.spec-table { width: 100%; border-collapse: collapse; }
  table.spec-table td { border: 1px solid #000000; padding: 5pt 6pt; font-size: 9pt; }
  table.spec-table td.label { width: 42%; font-weight: bold; }
  table.spec-table td.th { font-weight: bold; text-align: center; background-color: #1f4e79; color: #ffffff; }
</style>
</head>
<body>
  <div id="logo_content"><img src="{% static 'images/logo.png' %}"></div>
  <div id="photo_content"><img src="{{ product.cover_image }}"></div>

  <h1 class="product-name">{{ product.name }}</h1>
  <p class="price">Price: Rs. {{ product.price }}</p>

  <table class="spec-table">
    <tr>
      <td class="th">Parameter</td>
      <td class="th">Value</td>
    </tr>
    {% for spec in specifications %}
    <tr>
      <td class="label">{{ spec.label }}</td>
      <td>{{ spec.value }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="2">No specifications added yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
