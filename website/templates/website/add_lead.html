{% extends "website/base.html" %}
{% block title %}Add Lead | Spectrum Technologies{% endblock %}

{% block content %}
<section class="contact-section" style="max-width: 500px;">
    <h2>Add New Lead</h2>
    <p style="text-align:center; margin-bottom: 20px; color: #4a5568;">
        Adding as: <strong>{{ name }}</strong>
    </p>

    <form method="POST" class="contact-form">
        {% csrf_token %}
        <label for="name">Customer Name</label>
        <input type="text" id="name" name="name" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="location">Location (City)</label>
        <input type="text" id="location" name="location" placeholder="e.g. Vapi, Gujarat">

        <button type="submit">Save Lead</button>
    </form>

    <div class="dashboard-actions" style="justify-content: center; margin-top: 20px;">
        <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
    </div>
</section>
{% endblock %}
